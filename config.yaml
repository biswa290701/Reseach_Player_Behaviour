# Project Configuration
# All random seeds for reproducibility
random_seed: 42

# Data Generation
data_generation:
  n_samples_per_class: 2500
  n_features: 14
  noise_level: 0.3
  class_overlap: 0.25
  output_path: "data/raw/synthetic_telemetry.csv"

# Feature Engineering
features:
  test_size: 0.2
  val_size: 0.15
  scale_features: true

# Models
models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
    solver: "lbfgs"
  
  svm:
    kernel: "rbf"
    C: 1.0
    gamma: "scale"
    probability: true
  
  random_forest:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 5
    min_samples_leaf: 2
    n_jobs: -1
  
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: -1
    eval_metric: "mlogloss"

# Cross-Validation
cv:
  n_splits: 5
  shuffle: true

# Evaluation
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  average: "weighted"

# Paths
paths:
  models_dir: "models"
  figures_dir: "reports/figures"
  processed_data: "data/processed"